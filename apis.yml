description: UBIO (ubio.ai, formerly ub.io) is a London-based, Techstars-backed web
  automation company. Its Automation Cloud platform runs automation scripts as jobs
  through a REST API, automating end-to-end website flows such as flight and hotel
  booking, broadband signup, insurance quotes, and job applications. Developers create
  jobs with inputs, receive outputs and lifecycle events, and handle deferred inputs
  and 3-D Secure through official JavaScript/TypeScript client libraries, with the
  ubio Automation Protocol defining typed input/output schemas for more than 50 automation
  domains.
