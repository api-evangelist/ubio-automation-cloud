apis:
- name: UBIO Automation Cloud API
  description: REST API for running automation jobs on the Automation Cloud. Clients
    create jobs against a service, supply initial and deferred inputs, poll job events,
    retrieve outputs, handle 3-D Secure challenges, and cancel jobs. Authenticated
    with an App Secret Key (HTTP basic) or OAuth2 client credentials issued by the
    Automation Cloud Keycloak realm.
  humanURL: https://github.com/automationcloud/client-javascript
  baseURL: https://api.automationcloud.net
  tags:
  - Jobs
  - Automation
  - Web Automation
  properties:
  - type: APIReference
    url: https://protocol.automationcloud.net/
  - type: SDK
    url: https://github.com/automationcloud/client-javascript
  - type: ErrorCatalog
    url: errors/ubio-automation-cloud-problem-types.yml
- name: UBIO Vault API
  description: Automation Cloud Vault API for exchanging sensitive payment card data
    for opaque tokens before passing it to automation jobs. Clients obtain a one-time
    password, then vault a PAN or arbitrary data object to receive a token that automation
    scripts can consume without exposing the underlying card details.
  humanURL: https://github.com/automationcloud/client-javascript
  baseURL: https://vault.automationcloud.net
  tags:
  - Vault
  - Payments
  - Tokenization
