generated: '2026-07-21'
method: searched
source: https://protocol.automationcloud.net/schema.json
format: custom
envelope:
  description: Automation Cloud API errors are returned as a JSON object envelope
    (observed live on https://api.automationcloud.net/).
  fields:
    object: always "error"
    code: machine-readable error code in PascalCase (e.g. notFound)
    name: error class name (e.g. RouteNotFoundError)
    message: human-readable message
    details: arbitrary object with debugging details
  example:
    object: error
    code: notFound
    name: RouteNotFoundError
    message: Route not found
    details: {}
job_error_categories:
  description: Job failures carry a JobError with code (PascalCase), category, message,
    and details, per the official client library types.
  categories:
  - client: errors caused by client actions (invalid inputs, job cancelled)
  - server: platform-related failures (worker crash, timeout, API unavailable)
  - website: known limitations of the automated website (unsupported feature, flow, layout)
  source: https://github.com/automationcloud/client-javascript/blob/master/src/main/types.ts
