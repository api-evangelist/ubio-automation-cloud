- name: EndUser
  description: The end user attached to a job, retrieved via GET /jobs/{jobId}/end-user.
- name: Tds
  description: 3-D Secure challenge object (id, url) surfaced when a job enters the
    awaitingTds state.
- name: Domain
  description: Automation Protocol domain (e.g. FlightBooking, HotelBooking, BroadbandSignup)
    defining typed inputs, outputs, and error codes for a category of automation;
